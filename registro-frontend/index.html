<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Fredoka:wght@400;600&family=Poppins:wght@400;500;600&family=Lexend:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Roboto:wght@400;500;700&display=swap">

  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Registro Elettronico Scolastico - Piattaforma istituzionale per la gestione del registro di classe, voti, presenze e comunicazioni." />
  
  <!-- OpenGraph & Search Indexing Guards -->
  <meta property="og:title" content="Registro Elettronico" />
  <meta property="og:description" content="Piattaforma istituzionale per la gestione del registro di classe, voti, presenze e comunicazioni." />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="it_IT" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: http: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self';" />

  <title>Registro Elettronico</title>
</head>

<body>
  <div id="app"></div>
  <script>
    // Visible fallback for a blank page: shows the raw error inline when
    // devtools aren't available (e.g. iPad Safari without a Mac to inspect).
    // Remove once the blank-page investigation is resolved.
    (function () {
      function show(title, detail) {
        var fullText = title + '\n' + detail
        var box = document.createElement('div')
        box.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999;max-height:70vh;overflow:auto;background:#fef2f2;color:#b91c1c;padding:16px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.2);'
        var pre = document.createElement('pre')
        pre.style.cssText = 'white-space:pre-wrap;font:12px monospace;margin:0 0 8px 0;'
        pre.textContent = fullText
        var btnRow = document.createElement('div')
        btnRow.style.cssText = 'display:flex;gap:8px;'
        var copyBtn = document.createElement('button')
        copyBtn.textContent = 'Copia testo errore'
        copyBtn.style.cssText = 'font:13px sans-serif;padding:8px 12px;border-radius:6px;border:1px solid #b91c1c;background:#fff;color:#b91c1c;'
        copyBtn.addEventListener('click', function () {
          function fallbackCopy() {
            var ta = document.createElement('textarea')
            ta.value = fullText
            ta.style.position = 'fixed'
            ta.style.opacity = '0'
            document.body.appendChild(ta)
            ta.focus()
            ta.select()
            try { document.execCommand('copy') } catch (e) {}
            document.body.removeChild(ta)
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(fullText).catch(fallbackCopy)
          } else {
            fallbackCopy()
          }
          copyBtn.textContent = 'Copiato!'
          setTimeout(function () { copyBtn.textContent = 'Copia testo errore' }, 1500)
        })
        var closeBtn = document.createElement('button')
        closeBtn.textContent = 'Chiudi'
        closeBtn.style.cssText = 'font:13px sans-serif;padding:8px 12px;border-radius:6px;border:1px solid #b91c1c;background:#fff;color:#b91c1c;'
        closeBtn.addEventListener('click', function () { box.remove() })
        btnRow.appendChild(copyBtn)
        btnRow.appendChild(closeBtn)
        box.appendChild(pre)
        box.appendChild(btnRow)
        document.body.appendChild(box)
      }
      // Exposed so Vue's own app.config.errorHandler (which intercepts
      // component errors before they'd ever reach window.onerror) can also
      // surface them here.
      window.__showBlankPageError = show
      window.addEventListener('error', function (e) {
        show('Errore JavaScript:', (e.message || '') + '\n' + (e.filename || '') + ':' + (e.lineno || '') + '\n' + (e.error && e.error.stack || ''))
      })
      window.addEventListener('unhandledrejection', function (e) {
        show('Promise non gestita:', (e.reason && (e.reason.stack || e.reason.message || e.reason)) || String(e.reason))
      })

      // Remote diagnostic logger: since devtools aren't reachable on this
      // device, mirror console output and explicit checkpoints to a log
      // file on the server so it can be inspected from there instead.
      // Temporary — remove once the blank-page investigation concludes.
      function remoteLog(tag, data) {
        try {
          var payload = JSON.stringify({ tag: tag, data: data, url: location.href, ua: navigator.userAgent })
          fetch('/registro/remote-log.php', { method: 'POST', body: payload, keepalive: true }).catch(function () {})
        } catch (e) {}
      }
      window.__remoteLog = remoteLog
      remoteLog('boot', 'index.html inline script running')
      ;['log', 'warn', 'error'].forEach(function (level) {
        var orig = console[level]
        console[level] = function () {
          try {
            remoteLog('console.' + level, Array.prototype.slice.call(arguments).map(function (a) {
              return a instanceof Error ? (a.stack || a.message) : (typeof a === 'object' ? JSON.stringify(a) : String(a))
            }).join(' '))
          } catch (e) {}
          return orig.apply(console, arguments)
        }
      })
      window.addEventListener('error', function (e) {
        remoteLog('window.error', (e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''))
      })
      window.addEventListener('unhandledrejection', function (e) {
        remoteLog('unhandledrejection', String(e.reason && (e.reason.stack || e.reason.message || e.reason)))
      })
    })()
  </script>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
